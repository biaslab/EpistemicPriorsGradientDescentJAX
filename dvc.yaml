stages:
  tmaze_convergence_curves:
    cmd: uv run python scripts/tmaze/convergence_analysis.py --analysis curves --output-dir data/tmaze/convergence
    params:
      - tmaze.convergence.curves
    deps:
      - scripts/tmaze/convergence_analysis.py
      - src/environments/tmaze.py
      - src/planning/factorized_optimizer.py
      - src/objectives/factorized_vfe.py
    outs:
      - data/tmaze/convergence/curves.json

  tmaze_convergence_lr_sweep:
    cmd: uv run python scripts/tmaze/convergence_analysis.py --analysis lr_sweep --output-dir data/tmaze/convergence
    params:
      - tmaze.convergence.lr_sweep
    deps:
      - scripts/tmaze/convergence_analysis.py
      - src/environments/tmaze.py
      - src/planning/factorized_optimizer.py
      - src/objectives/factorized_vfe.py
    outs:
      - data/tmaze/convergence/lr_sweep.json

  tmaze_convergence_budget:
    cmd: uv run python scripts/tmaze/convergence_analysis.py --analysis budget --output-dir data/tmaze/convergence
    params:
      - tmaze.convergence.budget
    deps:
      - scripts/tmaze/convergence_analysis.py
      - src/environments/tmaze.py
      - src/planning/factorized_optimizer.py
      - src/objectives/factorized_vfe.py
    outs:
      - data/tmaze/convergence/budget.json

  tmaze_convergence_variance:
    cmd: uv run python scripts/tmaze/convergence_analysis.py --analysis variance --output-dir data/tmaze/convergence
    params:
      - tmaze.convergence.variance
    deps:
      - scripts/tmaze/convergence_analysis.py
      - src/environments/tmaze.py
      - src/planning/factorized_optimizer.py
      - src/objectives/factorized_vfe.py
    outs:
      - data/tmaze/convergence/variance.json

  tmaze_convergence_policy_stability:
    cmd: uv run python scripts/tmaze/convergence_analysis.py --analysis policy_stability --output-dir data/tmaze/convergence
    params:
      - tmaze.convergence.policy_stability
    deps:
      - scripts/tmaze/convergence_analysis.py
      - src/environments/tmaze.py
      - src/planning/factorized_optimizer.py
      - src/objectives/factorized_vfe.py
    outs:
      - data/tmaze/convergence/policy_stability.json

  tmaze_convergence_scenario_curves:
    cmd: uv run python scripts/tmaze/convergence_analysis.py --analysis scenario_curves --output-dir data/tmaze/convergence
    params:
      - tmaze.convergence.scenario_curves
    deps:
      - scripts/tmaze/convergence_analysis.py
      - src/environments/tmaze.py
      - src/planning/factorized_optimizer.py
      - src/objectives/factorized_vfe.py
    outs:
      - data/tmaze/convergence/scenario_curves.json

  tmaze_convergence_figures:
    cmd: uv run python scripts/tmaze/plot_convergence.py --input-dir data/tmaze/convergence --output-dir data/tmaze/convergence/figures
    params:
      - colors
    deps:
      - scripts/tmaze/plot_convergence.py
      - data/tmaze/convergence/curves.json
      - data/tmaze/convergence/lr_sweep.json
      - data/tmaze/convergence/budget.json
      - data/tmaze/convergence/variance.json
      - data/tmaze/convergence/policy_stability.json
      - data/tmaze/convergence/scenario_curves.json
    outs:
      - data/tmaze/convergence/figures

  tmaze_experiment_marginal:
    cmd: uv run python scripts/tmaze/experiment.py --inference-mode marginal --output-dir data/tmaze/marginal
    params:
      - tmaze.experiment.n_episodes
      - tmaze.experiment.max_steps
      - tmaze.experiment.planning_horizon
      - tmaze.experiment.receding_horizon
      - tmaze.experiment.n_optimization_steps
      - tmaze.experiment.learning_rate
      - tmaze.experiment.seed
    deps:
      - scripts/tmaze/experiment.py
      - src/environments/tmaze.py
      - src/planning/factorized_optimizer.py
      - src/objectives/factorized_vfe.py
      - src/visualization/tmaze_viz.py
    outs:
      - data/tmaze/marginal/results.json
      - data/tmaze/marginal/stats.json
      - data/tmaze/marginal/episode.mp4
      - data/tmaze/marginal/frames

  tmaze_experiment_active:
    cmd: uv run python scripts/tmaze/experiment.py --inference-mode active --output-dir data/tmaze/active
    params:
      - tmaze.experiment.n_episodes
      - tmaze.experiment.max_steps
      - tmaze.experiment.planning_horizon
      - tmaze.experiment.receding_horizon
      - tmaze.experiment.n_optimization_steps
      - tmaze.experiment.learning_rate
      - tmaze.experiment.seed
    deps:
