      - src/environments/tmaze.py
      - src/planning/factorized_optimizer.py
      - src/objectives/factorized_vfe.py
      - src/visualization/tmaze_viz.py
    outs:
      - data/tmaze/active/results.json
      - data/tmaze/active/stats.json
      - data/tmaze/active/episode.mp4
      - data/tmaze/active/frames

  tmaze_experiment_planning:
    cmd: uv run python scripts/tmaze/experiment.py --inference-mode planning --output-dir data/tmaze/planning
    params:
      - tmaze.experiment.n_episodes
      - tmaze.experiment.max_steps
      - tmaze.experiment.planning_horizon
      - tmaze.experiment.receding_horizon
      - tmaze.experiment.n_optimization_steps
      - tmaze.experiment.learning_rate
      - tmaze.experiment.seed
    deps:
      - scripts/tmaze/experiment.py
      - src/environments/tmaze.py
      - src/planning/factorized_optimizer.py
      - src/objectives/factorized_vfe.py
      - src/visualization/tmaze_viz.py
    outs:
      - data/tmaze/planning/results.json
      - data/tmaze/planning/stats.json
      - data/tmaze/planning/episode.mp4
      - data/tmaze/planning/frames

  # ==================== Epistemic Maze ====================

  epistemic_planning:
    cmd: >
      uv run python scripts/epistemic_maze/experiment.py
      --strategy temporal
      --inference-mode planning
      --output-dir data/epistemic_maze
      --n-episodes ${epistemic_maze.n_episodes}
      --horizon ${epistemic_maze.horizon}
      --max-steps ${epistemic_maze.max_steps}
      --n-opt-steps ${epistemic_maze.n_optimization_steps}
      --learning-rate ${epistemic_maze.learning_rate}
      --n-theta ${epistemic_maze.n_theta}
      --goal-temperature ${epistemic_maze.goal_temperature}
      --cue-accuracy ${epistemic_maze.cue_observation_accuracy}
      --seed ${epistemic_maze.seed}
    params:
      - epistemic_maze.n_episodes
      - epistemic_maze.horizon
      - epistemic_maze.max_steps
      - epistemic_maze.receding_horizon
      - epistemic_maze.n_optimization_steps
      - epistemic_maze.learning_rate
      - epistemic_maze.n_theta
      - epistemic_maze.goal_temperature
      - epistemic_maze.cue_observation_accuracy
      - epistemic_maze.location_observation_accuracy
      - epistemic_maze.cue_cost_epsilon
      - epistemic_maze.seed
    deps:
      - scripts/epistemic_maze/experiment.py
      - src/environments/epistemic_maze.py
      - src/planning/temporal_optimizer.py
