[project]
name = "epistemic-priors-experiments"
version = "0.1.0"
description = "Epistemic priors for Active Inference planning via variational optimization in JAX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.6.2",
    "jaxlib>=0.4.20",
    "optax>=0.1.7",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "imageio[ffmpeg]>=2.31.0",
    "pyyaml>=6.0",
    "dvc>=3.0.0",
    "tqdm>=4.65.0",
    "inferactively-pymdp==0.0.7.1",
    "gymnasium>=1.2.3",
    "minigrid>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-xdist>=3.0.0", "debugpy>=1.8.19"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
inferactively-pymdp = { git = "https://github.com/infer-actively/pymdp.git", rev = "23c206fc0e089ef8e2e6c80fb0162cb10a0fcdf9" }

[dependency-groups]
dev = ["pytest>=9.0.2"]
