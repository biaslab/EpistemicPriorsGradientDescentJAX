[project]
name = "jax-active-inference"
version = "0.1.0"
description = "Active Inference planning via variational optimization in JAX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "optax>=0.1.7",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "debugpy>=1.8.19",
    "imageio[ffmpeg]>=2.31.0",
    "pyyaml>=6.0",
    "dvc>=3.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
