# T-Maze experiment parameters
tmaze:
  experiment:
    n_episodes: 5
    max_steps: 4
    planning_horizon: 4
    receding_horizon: true
    n_optimization_steps: 1500
    learning_rate: 0.05
    seed: 18
  convergence:
    curves:
      n_episodes: 1
      n_optimization_steps: 1500
      learning_rate: 0.05
      planning_horizon: 4
      max_steps: 4
      seed: 42
    lr_sweep:
      learning_rates: [0.005,]
      n_episodes: 1
      n_optimization_steps: 1500
      planning_horizon: 4
      max_steps: 4
      seed: 42
    budget:
      budgets: [50, ]
      n_episodes: 1
      learning_rate: 0.05
      planning_horizon: 4
      max_steps: 4
      seed: 42
    variance:
      seeds: [42, ]
      n_episodes: 1
      n_optimization_steps: 1500
      learning_rate: 0.05
      planning_horizon: 4
      max_steps: 4
    policy_stability:
      budgets: [50, ]
      learning_rate: 0.05
      planning_horizon: 4
      seed: 42
    scenario_curves:
      n_optimization_steps: 1500
      learning_rate: 0.05
      planning_horizon: 4
      seed: 42

# Epistemic Maze experiment parameters
epistemic_maze:
  n_episodes: 5
  horizon: 3
  max_steps: 5
  n_optimization_steps: 1000
  learning_rate: 0.01
  seed: 42
  goal_temperature: 1.0
  cue_observation_accuracy: 1.0
  location_observation_accuracy: 0.95
  cue_cost_epsilon: 1.1
  n_theta: 2
  convergence:
    n_episodes: 1
    learning_rates: "0.005,0.01,0.05,0.1"
    optimization_budgets: "50,100,250,500,1000,2000"
    n_seeds: 1
    base_learning_rate: 0.01
    base_n_opt_steps: 1000

# MiniGrid DoorKey experiment parameters
minigrid:
  grid_size: 6
  n_episodes: 50
  max_steps: 35
  fov_size: 3
  seed: 42
  goal_scale: 0.25
  record: "first,last"
  planning_horizon: 20
  n_optimization_steps: 3000
  learning_rate: 0.01
  optimizer_type: "adam"
  convergence:
    threshold: 1.0

# Color scheme (ColorBrewer Paired palette)
colors:
  active: "#1F78B4"    # blue
  marginal: "#33A02C"  # green
  planning: "#FF7F00"  # orange
