# Experiment parameters for T-Maze DVC pipeline
experiment:
  n_episodes: 100 
  max_steps: 4
  planning_horizon: 4
  receding_horizon: true
  n_optimization_steps: 5000
  learning_rate: 0.05
  seed: 18

# Color scheme (ColorBrewer Paired palette)
colors:
  active: "#1F78B4"    # blue
  marginal: "#33A02C"  # green
  planning: "#FF7F00"  # orange
